system_template: |
  You are a software tester. You find bugs in Python projects by writing pytest tests.
  You have a bash tool. Answer with exactly one bash command: the one that writes the test file.

unit_template: |
  # Project: {{project}}

  {{summary}}

  The code contains small bugs (for example a wrong comparison, an off-by-one constant, or a wrong
  arithmetic or boolean operator) that the existing tests do not catch. You test ONE part of it.

  ## Unit: {{unit}}

  Module `{{module}}`, file `{{file}}`, lines {{first_line}}-{{last_line}}. Shown: {{view}}.

  ```python
  {{source}}
  ```

  ## What the documentation says about it

  ```rst
  {{docs}}
  ```

  ## Test design hints (computed from the code)

  {{hints}}

  Bugs hide in the cases above that ordinary tests skip, so cover them: at least half of your
  tests should use one of these boundary values or input classes.

  ## Already found for this unit

  These tests were written earlier and already report a problem. Do not test the same behaviour
  again; look for different bugs.

  ```python
  {{already}}
  ```

  ## Your task

  Write `{{test_file}}`: 8 to 15 small pytest test functions. Focus on {{focus}}.

  - The code above may be buggy. Decide each expected value from the documentation, the docstrings,
    the names, and your own reasoning about what the code promises, never from what the code does.
    Work small examples out by hand. If the code seems to disagree with the documentation, that is
    probably a bug: assert the documented value (a test that asserts the buggy value is useless).
  - Each test checks one thing with a plain `assert` against an exact expected value.
  - Only use names and parameters that appear in the code above. Test through the public API:
    import public names (not starting with `_`) from `{{package}}` or `{{module}}`.
  - Tests must be deterministic: no randomness, no real sleeping, no clocks. Where the code accepts a
    timer or similar function, pass your own fake one whose value you set explicitly between steps
    (for example `now = [0]`, `timer=lambda: now[0]`, then `now[0] = 5`); never one that changes
    each time it is called, because how often the code calls it is not documented.
  - Do not rely on side effects the documentation does not state (for example, that one operation
    also changes an order, a counter or some other state that a later operation depends on). Make
    every step that matters explicit in the test.
  - Write `assert x in s` or `assert x not in s`, never `assert x in s is True` (in Python that
    means `x in s and s is True`, which is always False).
  - Do not import os, sys, inspect, pathlib, io or subprocess, and do not call open, eval or exec.

  Everything you need is above: do not read any files. Reply with ONE bash command that writes the
  whole file, like this:

  cat > {{test_file}} <<'EOF'
  from {{package}} import ...

  def test_...():
      ...
  EOF

review_system_template: |
  You are a careful reviewer of pytest tests. You have a bash tool. Answer with exactly one bash
  command: a printf of your verdict lines.

review_template: |
  # Project: {{project}}

  {{summary}}

  Someone wrote tests for `{{unit}}` (module `{{module}}`). The code may contain small bugs, and
  the tests below FAIL on the current code. For each test, decide who is wrong:

  - KEEP: the documentation or docstrings clearly promise the value the test expects, so the code
    is wrong and the test has found a bug.
  - DROP: the test is wrong (it misreads the API, miscounts, or assumes something the docs do not
    say), or the docs do not clearly decide it.

  Most failing tests are wrong tests, so only answer KEEP when you are sure. Answer DROP when the
  test depends on a detail the documentation does not state, for example: the iteration or display
  order of items (unless the docs say how they are ordered), how many times a callback, timer or
  key function is called, the exact type or internal structure of a returned object, `repr` or
  error message text, which item is chosen when several are equally valid, what happens exactly at
  a boundary the docs do not define (for example "before" versus "at" a limit), or a side effect of
  an operation that the docs do not state.

  ## Documentation

  ```rst
  {{docs}}
  ```

  ## Signatures and docstrings (bodies left out on purpose)

  ```python
  {{spec}}
  ```

  ## The project's own tests

  These tests come with the project and all PASS on the current code, so they show how the code
  really behaves wherever they check it (the bugs are in places they do not check). If a failing
  test expects something that these tests contradict, the failing test is wrong: DROP it.

  ```python
  {{existing}}
  ```

  ## Failing tests

  {{tests}}

  ## How to answer

  For each test, trace it by hand line by line, using only the documentation above: write down the
  state after each statement, then the value the documentation promises at the assert. Then reply
  with ONE bash command that prints one line per test ({{names}}), like this:

  printf 'test_name_one: KEEP\ntest_name_two: DROP\n'

oracle_system_template: |
  You predict what Python code does, using only the documentation of the library it calls. You have
  a bash tool. Answer with exactly one bash command: a heredoc with your answer lines.

oracle_template: |
  # Project: {{project}}

  {{summary}}

  Below are short snippets that use `{{unit}}` (module `{{module}}`). For each one, work out from
  the documentation what `result` is at the end (or whether the last block raises). The library
  may contain small bugs, so do not guess what a buggy implementation might do: say what the
  documentation and the project's own tests say it should be.

  ## Documentation

  ```rst
  {{docs}}
  ```

  ## Signatures and docstrings

  ```python
  {{spec}}
  ```

  ## The project's own tests

  These come with the project and pass, so they show the real behaviour wherever they check it.

  ```python
  {{existing}}
  ```

  ## Snippets

  {{snippets}}

  ## How to answer

  For each snippet, trace it line by line and write down the state after each statement (for any
  object: all of its state that matters, for example the full contents and their order, and what
  the next operation would do with it). Then reply with ONE bash command that prints one line per snippet ({{names}}),
  each a Python literal (or RAISES / NO where asked), like this:

  cat <<'EOF'
  snippet_1: [1, 2, 3]
  snippet_2: 'b'
  snippet_3: True
  EOF
